name: Aggiorna cambi e pubblica

on:
  schedule:
    # 00:47 e 15:47 UTC = 07:47 e 22:47 ora di Phnom Penh
    - cron: "47 0,15 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scarica i tassi
        if: github.event_name != 'push'
        run: python3 scripts/fetch_rates.py

      - name: Salva rates.json se cambiato
        if: github.event_name != 'push'
        run: |
          if ! git diff --quiet rates.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add rates.json
            git commit -m "Aggiorna tassi di cambio"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
